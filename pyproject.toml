[project]
name = "math-solver-app"
version = "1.0.0"
description = "A free math-solving web application with detailed explanations, image generation, and PDF support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.3",
    "sympy>=1.12",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "reportlab>=4.1.0",
    "pymupdf>=1.23.0",
    "Pillow>=10.2.0",
    "aiofiles>=23.2.1",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "markdown>=3.5.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
